name: heartbeat

# Drift-proof driver for the two live-critical, high-frequency ingests that
# GitHub's scheduler drops hardest: globe-ingest and notify-tool-alerts (both
# were `*/5 * * * *`). GitHub deprioritises frequent scheduled crons — on this
# repo the `*/5` jobs were firing only every 2-4h, so the live map aged toward
# its 4h window between real runs.
#
# The mechanism: a RUNNING job is immune to scheduler throttling. This
# workflow loops INTERNALLY every 5 minutes, curling the ingest endpoints
# itself, and — since S124 — DISPATCHES ITS OWN SUCCESSOR five minutes before
# its loop window ends, so coverage no longer depends on the scheduler at all.
#
# WHY SELF-DISPATCH (measured, not assumed):
# - S93 sized the loop at 175 min against a max observed restart gap of 127
#   min. Measured again 2026-09-10..15 (36 consecutive scheduled fires of the
#   `2,17,32,47` schedule): fire-to-fire median 209 min, max 365 min. The
#   hosted-runner job cap is 360 min, so NO loop length can bridge that gap —
#   a longer loop is a symptom patch that the next scheduler regression
#   defeats again.
# - The cost was visible in the data. `scripts/ops/status-bucket-census.mjs`
#   (D+1 check after PR #133) put the per-day status sample counts at
#   251 / 228 / 200 for 12/13/14 Sep against a designed 288. The blind
#   minutes per day (sum of gaps between one loop ending and the next fire
#   landing) were 212 / 306 / 494 → predicted 245 / 227 / 190. Blind windows
#   cost more than traffic fills; the deficit IS the scheduler gap.
#
# HOW THE CHAIN WORKS:
# - `concurrency.cancel-in-progress: false` (was true). A dispatched
#   successor PENDS until this run exits and then starts at once — no
#   cancelled runs in the history, and the gap between generations is only
#   runner allocation (seconds). GitHub keeps at most ONE pending run per
#   concurrency group, so a scheduled fire landing mid-run and the
#   self-dispatched successor never stack: whichever is newer pends, the
#   older pending one is cancelled by GitHub.
# - The successor is dispatched with the repo's own GITHUB_TOKEN under
#   `permissions: actions: write`. `workflow_dispatch` is one of the two
#   events GITHUB_TOKEN IS allowed to trigger (video-watchdog's header says
#   otherwise — its "admin rights" error came from the zero-scope GH_TOKEN,
#   not from GITHUB_TOKEN). Verified live on this branch before merge; see
#   PR body.
# - A dispatch failure is NOT a warning: the run finishes its tick window
#   (coverage first) and then exits 1, so a broken chain is a RED run in the
#   Actions list. The cron schedule stays as belt-and-braces — it restarts
#   the chain on its own (slow) cadence if a dispatch ever fails.
# - `loop_minutes` (workflow_dispatch input, default 175) is passed down the
#   chain unchanged, so a short test chain stays short and the scheduled
#   chain stays at 175. Scheduled runs have no inputs → 175.
#
# KILL SWITCH (the chain is infinite by design):
#   gh workflow disable heartbeat.yml   # the next self-dispatch is rejected
#                                       # → that run ends red, chain stops
#   gh run cancel <id>                  # ends the current run immediately
#   gh workflow enable heartbeat.yml && gh workflow run heartbeat.yml --ref main
# Verified live 2026-09-15 on this branch: run A dispatched B (pending within
# 20s, started seconds after A exited); with the workflow disabled, B's
# dispatch was refused with HTTP 422 "Cannot trigger a 'workflow_dispatch' on
# a disabled workflow", B finished its tick window and exited 1 (red).
#
# Public repo → unlimited Actions minutes, so a near-continuous loop is free.
# Both endpoints are thin, idempotent poll-and-dedupe triggers (all compute is
# server-side on Vercel), so calling them every 5 minutes only restores the
# ORIGINALLY-DESIGNED `*/5` load — it adds nothing above the budget the
# ingests already assumed.
#
# Required repo secrets (same as globe-ingest / notify-tool-alerts):
#   INGEST_URL     — full URL to /api/ingest, e.g. https://…/api/ingest
#   INGEST_SECRET  — shared secret matching Vercel's INGEST_SECRET
#
# Scope note: reddit and the registry crons are deliberately NOT in the
# 5-minute loop — they poll external, rate-limited sources and folding them
# in at 5-min cadence would trade a cadence bug for a rate-limit ban.
# Ticking a feed at its OWN designed cadence, however, adds nothing above
# the load its budget always assumed — that is the rss precedent, and
# wire-ingest-hn joined it on 2026-07-06 (its 5,20,35,50 schedule went
# silent for 4.5h overnight → stale flag; heartbeat now ticks it every 3rd
# iteration = its designed 15-min cadence; own schedule stays as
# belt-and-braces per #64 verify-before-disable).
#
# wire-ingest-rss is the exception (added S93): the original "explicit-minute
# schedules drift far less" premise was FALSIFIED by observation — its
# `25,55 * * * *` schedule fired with 79min-4.3h real gaps, leaving the
# regional wire stale for hours at a time. It ticks every SIXTH loop
# iteration (30 min — exactly its designed cadence; once-per-run would leave
# it stale again at the observed 96-min restart gaps). 2/hour against 5
# public publisher feeds is the load it always assumed. Its own 25,55
# schedule stays as belt-and-braces until the heartbeat path is verified
# live (then retire it per the #64 verify-before-disable discipline).

on:
  schedule:
    - cron: "2,17,32,47 * * * *" # belt-and-braces restart; the chain is the primary driver
  workflow_dispatch:
    inputs:
      loop_minutes:
        description: "Tick window in minutes before the successor takes over (tests: 2)"
        required: false
        default: "175"

concurrency:
  group: heartbeat
  cancel-in-progress: false # successor pends until this run exits — no cancelled runs, ~0s gap

permissions:
  contents: read
  actions: write # self-dispatch of the successor run

jobs:
  pulse:
    runs-on: ubuntu-latest
    timeout-minutes: 185
    steps:
      - name: Loop the live-critical ingests every 5 minutes, then hand over
        env:
          INGEST_URL: ${{ secrets.INGEST_URL }}
          INGEST_SECRET: ${{ secrets.INGEST_SECRET }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          LOOP_MINUTES: ${{ inputs.loop_minutes || '175' }}
        run: |
          if [ -z "$INGEST_URL" ] || [ -z "$INGEST_SECRET" ]; then
            echo "::error::INGEST_URL or INGEST_SECRET is unset in repo secrets"
            exit 1
          fi
          case "$LOOP_MINUTES" in
            ''|*[!0-9]*) echo "::error::loop_minutes must be a positive integer, got '$LOOP_MINUTES'"; exit 1 ;;
          esac
          BASE="${INGEST_URL%/api/ingest}"
          NOTIFY_URL="$BASE/api/notify/tool-alerts"
          RSS_URL="$BASE/api/wire/ingest-rss"
          HN_URL="$BASE/api/wire/ingest-hn?source=heartbeat&cap=20"

          # One tick = poll both live-critical endpoints, logging each HTTP
          # status. Every 6th iteration (30 min — its designed cadence) also
          # ticks the regional RSS ingest; see scope note. Per-endpoint
          # failures are non-fatal: a bad tick is retried on the next one,
          # and the loop must never exit early (that would reopen the gap).
          i=0
          tick() {
            local code
            code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 100 \
              -H "x-ingest-secret: $INGEST_SECRET" -X POST "$INGEST_URL" 2>/dev/null) || code="000"
            echo "$(date -u +%H:%M:%S) globe-ingest        -> $code"
            [ "$code" = "200" ] || echo "::warning::globe-ingest tick returned $code"

            code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 60 \
              -H "x-ingest-secret: $INGEST_SECRET" -X POST "$NOTIFY_URL" 2>/dev/null) || code="000"
            echo "$(date -u +%H:%M:%S) notify-tool-alerts  -> $code"
            [ "$code" = "200" ] || echo "::warning::notify-tool-alerts tick returned $code"

            if [ $((i % 6)) -eq 0 ]; then
              code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 280 \
                -H "x-ingest-secret: $INGEST_SECRET" -X POST "$RSS_URL" 2>/dev/null) || code="000"
              echo "$(date -u +%H:%M:%S) wire-ingest-rss     -> $code"
              [ "$code" = "200" ] || echo "::warning::wire-ingest-rss tick returned $code"
            fi

            # Every 3rd iteration (15 min — wire-ingest-hn's designed 5,20,35,50
            # cadence; see scope note). POST, matching its own workflow's call.
            if [ $((i % 3)) -eq 0 ]; then
              code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 160 \
                -H "x-ingest-secret: $INGEST_SECRET" -X POST "$HN_URL" 2>/dev/null) || code="000"
              echo "$(date -u +%H:%M:%S) wire-ingest-hn      -> $code"
              [ "$code" = "200" ] || echo "::warning::wire-ingest-hn tick returned $code"
            fi
            i=$((i + 1))
          }

          # Hand over to the successor once, when ≤ 5 min of window remain.
          # It pends on the concurrency group until this run exits (see
          # header), so the ticks continue here until the very end.
          dispatched=0
          dispatch_ok=1
          handover() {
            [ "$dispatched" -eq 1 ] && return 0
            dispatched=1
            if gh workflow run heartbeat.yml --ref "$GITHUB_REF_NAME" -f "loop_minutes=$LOOP_MINUTES"; then
              echo "$(date -u +%H:%M:%S) successor dispatched on $GITHUB_REF_NAME (loop_minutes=$LOOP_MINUTES)"
            else
              dispatch_ok=0
              echo "::error::successor dispatch FAILED — the chain is broken; the cron schedule will restart it"
            fi
          }

          end=$((SECONDS + LOOP_MINUTES * 60))
          tick
          [ $((end - SECONDS)) -le 300 ] && handover
          while [ "$SECONDS" -lt "$end" ]; do
            sleep 300
            tick
            [ $((end - SECONDS)) -le 300 ] && handover
          done
          handover # a loop shorter than one sleep still hands over
          if [ "$dispatch_ok" -eq 1 ]; then
            echo "Loop window elapsed; successor carries coverage."
          else
            echo "Loop window elapsed with NO successor; coverage resumes at the next scheduled fire."
            exit 1
          fi
